<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthMind AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0F172A; color: #F8FAFC; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .chat-card { width: 100%; max-width: 440px; height: 600px; background: #1E293B; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .header { background: #4F46E5; padding: 18px; font-weight: 600; font-size: 1.1rem; text-align: center; }
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .user { align-self: flex-end; background: #4F46E5; color: white; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #334155; color: white; border-bottom-left-radius: 2px; }
    .input-area { display: flex; padding: 12px; background: #0F172A; gap: 8px; border-top: 1px solid #334155; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1E293B; color: white; outline: none; font-size: 0.95rem; }
    input:focus { border-color: #4F46E5; }
    button { padding: 12px 20px; background: #4F46E5; border: none; color: white; font-weight: 600; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

<div class="chat-card">
  <div class="header">HealthMind AI</div>
  <div class="messages" id="messages">
    <div class="msg bot">Hello! How can I assist you today?</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
  // YOUR CLOUDFLARE WORKER PROXY URL
  const PROXY_URL = "https://soft-shape-8438.24wh1a05p9.workers.dev"; 
  let conversationId = "";

  async function send() {
    const input = document.getElementById("userInput");
    const query = input.value.trim();
    if (!query) return;

    appendMessage(query, "user");
    input.value = "";

    try {
      const res = await fetch(PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: query, conversation_id: conversationId })
      });

      const data = await res.json();
      if (data.answer) {
        conversationId = data.conversation_id;
        appendMessage(data.answer, "bot");
      } else {
        appendMessage("Error processing response.", "bot");
      }
    } catch (err) {
      appendMessage("Network error. Please try again.", "bot");
    }
  }

  function appendMessage(text, type) {
    const box = document.getElementById("messages");
    const msg = document.createElement("div");
    msg.className = `msg ${type}`;
    msg.textContent = text;
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
  }
</script>

</body>
</html>
